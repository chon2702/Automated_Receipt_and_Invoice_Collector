[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goco-autoinvoices"
version = "0.1.0"
description = "Original invoice collection from Gmail and manual imports"
requires-python = ">=3.12"
dependencies = ["google-auth-oauthlib>=1.2,<2", "keyring>=25,<26", "requests>=2.32,<3", "defusedxml>=0.7,<1", "tzdata>=2026.1"]

[project.optional-dependencies]
aws = ["boto3>=1.43.118,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
goco = "goco.view.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=tmp/pytest"
